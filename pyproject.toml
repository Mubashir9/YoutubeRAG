[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "anthony-mantello-rag"
version = "0.1.0"
description = "A local, evidence-backed search assistant for supplied transcripts."
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2", "streamlit>=1.36,<2", "typer>=0.12,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[project.scripts]
youtube-rag = "youtube_rag.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

